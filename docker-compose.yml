services:
  db:
    image: postgres:16
    container_name: catalogo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo_dev
      POSTGRES_DB: catalogo
    ports:
      # Puerto del host 5433 para no chocar con otro PostgreSQL local en 5432
      - "5433:5432"
    volumes:
      # Volumen con nombre: los datos sobreviven a reinicios del contenedor
      - catalogo_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 (TCP): en el primer arranque la imagen levanta un servidor
      # temporal solo por socket Unix para crear la BD y luego se reinicia.
      # Por TCP, "healthy" solo llega cuando el servidor definitivo está listo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U catalogo -d catalogo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  catalogo_data:
